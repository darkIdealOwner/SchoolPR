<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SchoolPR{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #020617;
            --card-bg: #0f172a;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #f59e0b;
        }

        body {
            margin: 0;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        main {
            flex: 1;
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
            box-sizing: border-box;
        }

        header {
            background-color: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(12px);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--primary);
            text-decoration: none;
            letter-spacing: -0.025em;
        }

        .profile-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .profile-link {
            text-decoration: none;
            color: var(--text);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: color 0.2s;
        }

        .profile-link:hover {
            color: var(--primary);
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 1rem;
            padding: 2rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        {% block extra_css %}{% endblock %}
        
        footer {
            padding: 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background-color: rgba(15, 23, 42, 0.3);
            margin-top: 4rem;
        }
        
        footer p {
            margin: 0;
            font-size: 0.875rem;
            color: #64748b;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <header>
        <a href="{% url 'home' %}" class="logo">SchoolPR</a>
        <div class="nav-actions">
            <a href="{% url 'profile' %}" class="profile-link">
                <span>{{ user.first_name }}</span>
                <div class="profile-icon">{{ user.first_name|first|upper }}</div>
            </a>
        </div>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>&copy; 2026 Doniyor Adilov</p>
        <p><a href="mailto:blackskyofdarken@gmail.com" style="color: inherit; text-decoration: none;">blackskyofdarken@gmail.com</a></p>
    </footer>

    {% block extra_js %}{% endblock %}
</body>

</html>
