# nginx: принимает запросы из интернета (HTTPS) и передаёт их gunicorn.
# Устанавливается в /etc/nginx/sites-available/schoolpr, замените example.uz на свой домен.
# HTTPS-сертификат добавляет certbot (см. deploy/README.md).

server {
    listen 80;
    server_name example.uz www.example.uz;

    client_max_body_size 25m;   # загрузка файлов из 1С до 20 МБ

    location / {
        proxy_pass http://unix:/run/schoolpr/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
